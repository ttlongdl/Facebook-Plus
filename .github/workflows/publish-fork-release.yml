name: Publish Fork Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-fork-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove obsolete fork releases and tags
        run: |
          gh release delete v1.1.1 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release delete v1.1.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true

      - name: Download tested build artifacts
        run: |
          mkdir -p release-assets/build release-assets/injection
          gh run download 35679421957 --repo "$GITHUB_REPOSITORY" -n Facebook-Plus -D release-assets/build
          gh run download 35679421957 --repo "$GITHUB_REPOSITORY" -n FacebookPlus-1.0.1-1-Injection -D release-assets/injection
          find release-assets -maxdepth 3 -type f -print

      - name: Prepare release assets
        run: |
          set -euxo pipefail
          cp release-assets/build/Facebook-Plus-v1.0.1-1-rootless.deb release-assets/Facebook-Plus-v1.0.1-1-rootless.deb
          cp release-assets/build/Facebook-Plus-v1.0.1-1-rootfull.deb release-assets/Facebook-Plus-v1.0.1-1-rootfull.deb
          cd release-assets/injection
          zip -r ../FacebookPlus-v1.0.1-1-Injection.zip FacebookPlus.dylib FacebookPlus.bundle README.txt
          cd ../..
          test -s release-assets/Facebook-Plus-v1.0.1-1-rootless.deb
          test -s release-assets/Facebook-Plus-v1.0.1-1-rootfull.deb
          test -s release-assets/FacebookPlus-v1.0.1-1-Injection.zip

      - name: Publish v1.0.1-1
        run: |
          gh release delete v1.0.1-1 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create v1.0.1-1 \
            release-assets/Facebook-Plus-v1.0.1-1-rootless.deb \
            release-assets/Facebook-Plus-v1.0.1-1-rootfull.deb \
            release-assets/FacebookPlus-v1.0.1-1-Injection.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Facebook Plus v1.0.1-1 (ttlongdl fork)" \
            --notes "Fork release based on SHAJON Facebook Plus 1.0.1.

Local additions:
- DeepLinkBridge integrated into FacebookPlus.dylib.
- FBAudioFix integrated into FacebookPlus.dylib.
- Open in Facebook Safari extension source and sideload routing support.
- Rootless and rootfull jailbreak packages.
- Injection ZIP containing FacebookPlus.dylib + FacebookPlus.bundle for TrollFools/manual IPA workflows.

Known limitation:
- Reels opened directly from an external deep link may currently mix with existing background audio; normal in-app media/audio behavior remains under test.

Versioning follows <upstream>-<addon revision>."
