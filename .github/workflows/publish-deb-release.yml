name: Publish Facebook Plus DEB release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build 135 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packages
          gh run download 39335358483 --repo ttlongdl/Facebook-Plus \
            --name Facebook-Plus --dir packages
          ls -lh packages/

      - name: Validate both release packages
        run: |
          set -euo pipefail
          VERSION="1.0.2-1"
          for SCHEME in rootless rootfull; do
            DEB="packages/Facebook-Plus-v${VERSION}-${SCHEME}.deb"
            test -s "$DEB"
            PKG="$(dpkg-deb -f "$DEB" Package)"
            VER="$(dpkg-deb -f "$DEB" Version)"
            ARCH="$(dpkg-deb -f "$DEB" Architecture)"
            echo "$SCHEME: Package=$PKG Version=$VER Architecture=$ARCH"
            test "$PKG" = "com.shajon.fbplus"
            test "$VER" = "$VERSION"
            test "$ARCH" = "iphoneos-arm64"
          done
          sha256sum packages/*.deb

      - name: Publish v1.0.2-1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.2-1"
          NOTES="Facebook Plus v1.0.2-1 — rootless DEB for jailbreak installation and rootfull DEB for IPA injection. Built from main commit 959e65b79c915d854d7bdf4c076f591ee1e78bcc (Build #135). Includes integrated FBAudioFix audio arbitration improvements."
          if gh release view "$TAG" --repo ttlongdl/Facebook-Plus >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$TAG" packages/Facebook-Plus-v1.0.2-1-rootless.deb packages/Facebook-Plus-v1.0.2-1-rootfull.deb \
            --repo ttlongdl/Facebook-Plus \
            --target 959e65b79c915d854d7bdf4c076f591ee1e78bcc \
            --title "Facebook Plus v1.0.2-1" \
            --notes "$NOTES"
