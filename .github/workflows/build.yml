name: Build

# Verify the tweak compiles on every pull request and push to main by running
# the project's own build.sh.
#
# CI ships no decrypted Facebook IPA (it cannot, for legal reasons), so build.sh
# builds the .deb and skips the cyan injection step. The check therefore verifies
# that the package compiles cleanly; injection tooling (cyan) is not needed here.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Cancel an in-progress run when new commits are pushed to the same PR/branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak (.deb)
    # macOS so Theos uses Xcode's toolchain and iOS SDK directly — far more
    # reliable than a Linux cross-compiler + downloaded SDK.
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos build dependencies
        run: brew install ldid dpkg xz

      - name: Set up Theos
        run: git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Build
        run: ./build.sh


      - name: Collect raw FacebookPlus dylib
        run: |
          set -euxo pipefail
          DYLIB="$(find .theos/obj -type f -name 'FacebookPlus.dylib' ! -path '*.dSYM/*' -print -quit)"
          test -n "$DYLIB"
          mkdir -p artifacts
          cp "$DYLIB" artifacts/FacebookPlus.dylib

          BUNDLE="$(find .theos/_ -type d -name 'FacebookPlus.bundle' -print -quit)"
          test -n "$BUNDLE"
          ditto "$BUNDLE" artifacts/FacebookPlus.bundle
          test -f artifacts/FacebookPlus.bundle/Info.plist

          FILE_INFO="$(file artifacts/FacebookPlus.dylib)"
          echo "$FILE_INFO"
          echo "$FILE_INFO" | grep -q 'Mach-O.*dynamically linked shared library'
          if echo "$FILE_INFO" | grep -q 'dSYM companion'; then
            echo "error: selected dSYM DWARF companion instead of injectable dylib" >&2
            exit 1
          fi
          shasum -a 256 artifacts/FacebookPlus.dylib | tee artifacts/SHA256.txt

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Plus
          path: |
            packages/Facebook-Plus-v*.deb
            artifacts/FacebookPlus.dylib
            artifacts/FacebookPlus.bundle
            artifacts/SHA256.txt
          if-no-files-found: error
          retention-days: 30
