name: Build

# Verify the tweak compiles on every pull request and push to main by running
# the project's own build.sh.
#
# CI ships no decrypted Facebook IPA (it cannot, for legal reasons), so build.sh
# builds the .deb and skips the cyan injection step. The check therefore verifies
# that the package compiles cleanly; injection tooling (cyan) is not needed here.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Cancel an in-progress run when new commits are pushed to the same PR/branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak (.deb)
    # macOS so Theos uses Xcode's toolchain and iOS SDK directly — far more
    # reliable than a Linux cross-compiler + downloaded SDK.
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos build dependencies
        run: brew install ldid dpkg xz

      - name: Set up Theos
        run: git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Build
        run: ./build.sh

      - name: Export sideload injection assets
        run: |
          set -euxo pipefail
          ROOTFULL="$(find packages -maxdepth 1 -type f -name '*-rootfull.deb' -print -quit)"
          test -n "$ROOTFULL"
          rm -rf injection-export /tmp/fbplus-deb
          mkdir -p injection-export /tmp/fbplus-deb
          dpkg-deb -x "$ROOTFULL" /tmp/fbplus-deb
          DYLIB="$(find /tmp/fbplus-deb -type f -name 'FacebookPlus.dylib' -print -quit)"
          BUNDLE="$(find /tmp/fbplus-deb -type d -name 'FacebookPlus.bundle' -print -quit)"
          test -f "$DYLIB"
          test -d "$BUNDLE"
          echo "==> Sideload export dependencies:"
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | grep -q 'libroot'; then
            echo "error: sideload export unexpectedly links libroot" >&2
            exit 1
          fi
          cp "$DYLIB" injection-export/FacebookPlus.dylib
          cp -R "$BUNDLE" injection-export/FacebookPlus.bundle
          printf '%s\n' \
            "Sideload-neutral export from the rootfull package (no libroot dependency)." \
            "DeepLinkBridge and FBAudioFix are compiled into FacebookPlus.dylib." \
            > injection-export/README.txt

      - name: Upload injection assets
        uses: actions/upload-artifact@v4
        with:
          name: FacebookPlus-1.0.1-2-Injection
          path: injection-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Plus
          path: packages/Facebook-Plus-v*.deb
          if-no-files-found: error
          retention-days: 30
