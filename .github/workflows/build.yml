name: Build Tweak (.deb)

# Manually verify the tweak compiles using the project's own build.sh.
#
# CI ships no decrypted Facebook IPA (it cannot, for legal reasons), so build.sh
# builds the .deb and skips the cyan injection step. The check therefore verifies
# that the package compiles cleanly; injection tooling (cyan) is not needed here.

on:
  workflow_dispatch:

# Avoid overlapping manually dispatched runs on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak (.deb)
    # macOS so Theos uses Xcode's toolchain and iOS SDK directly — far more
    # reliable than a Linux cross-compiler + downloaded SDK.
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos build dependencies
        run: brew install ldid dpkg xz

      - name: Set up Theos
        run: git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Build
        run: ./build.sh


      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Plus
          path: packages/Facebook-Plus-v*.deb
          if-no-files-found: error
          retention-days: 30
